<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth — Firebase Read Probe (TEMPORARY DIAGNOSTIC)</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:760px;margin:20px auto;padding:0 16px;color:#2A2218;background:#faf8f5}
  h1{font-size:1.1rem}
  .note{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;font-size:.85rem;margin-bottom:16px}
  #out{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;background:#fff;border:1px solid #e0d8cc;border-radius:8px;padding:14px;line-height:1.5}
  .ok{color:#2e7d32}.slow{color:#c62828;font-weight:700}
</style>
</head>
<body>
<h1>Hearth — Firebase Read Probe</h1>
<div class="note">
  <strong>TEMPORARY DIAGNOSTIC PAGE.</strong> Attaches only <code>.info/connected</code>.
  No Hearth listeners, no Hearth modules, no writes. Reads 4 paths once each and times them.
  Open DevTools Console (filter <code>[PROBE]</code>) or read the on-page log below. Delete this file after use.
</div>
<div id="out">Loading Firebase SDK…</div>

<!-- Same SDK version as Hearth -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
(function(){
  var out = document.getElementById('out');
  out.textContent = '';
  var T0 = performance.now();
  function now(){ return (performance.now() - T0).toFixed(1); }
  function log(msg, cls){
    var line = '[PROBE] ' + msg;
    console.log(line);
    var span = document.createElement('div');
    if(cls) span.className = cls;
    span.textContent = line;
    out.appendChild(span);
  }

  // ── Same Firebase config as Hearth (utils.js) ──
  var FB = {
    apiKey:"AIzaSyA-JVr7hgGJZvlRWIA3RHWZ6SdzIkB5ngw",
    authDomain:"family-kitchen-628cb.firebaseapp.com",
    databaseURL:"https://family-kitchen-628cb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"family-kitchen-628cb",
    storageBucket:"family-kitchen-628cb.firebasestorage.app",
    messagingSenderId:"1033585168692",
    appId:"1:1033585168692:web:d0482fdfe9996c8c6c1561"
  };

  log('script baseline T0 set @0.0ms  online=' + navigator.onLine + ' visibility=' + document.visibilityState);
  log('firebase.initializeApp CALLED @' + now() + 'ms');
  firebase.initializeApp(FB);
  var db = firebase.database();
  log('db ready @' + now() + 'ms');

  // ── ONLY listener attached: .info/connected ──
  var probesFired = false;
  log('.info/connected listener ATTACH @' + now() + 'ms');
  db.ref('.info/connected').on('value', function(snap){
    log('.info/connected = ' + snap.val() + ' @' + now() + 'ms');
    if(snap.val() === true && !probesFired){
      probesFired = true;
      log('── connected=true → firing 4 simultaneous .once() reads @' + now() + 'ms ──');
      fireProbes();
    }
  });

  // ── The 4 isolated reads, issued simultaneously ──
  function fireProbes(){
    var paths = [
      'members',
      'planner/2026-07-19/0/D',
      'chatGroups',
      '__diagnostic_probe_nonexistent'
    ];
    paths.forEach(function(p){
      var issued = performance.now();
      log('read ISSUED  path=' + p + ' @' + now() + 'ms');
      db.ref(p).once('value')
        .then(function(snap){
          var done = performance.now();
          var val = snap.val();
          var exists = val !== null && val !== undefined;
          var len = 0;
          try { len = exists ? JSON.stringify(val).length : 0; } catch(e){ len = -1; }
          var elapsed = (done - issued).toFixed(1);
          var cls = (parseFloat(elapsed) > 3000) ? 'slow' : 'ok';
          log('read COMPLETE path=' + p +
              ' @' + now() + 'ms' +
              '  elapsed=' + elapsed + 'ms' +
              '  exists=' + exists +
              '  payloadLen=' + len, cls);
        })
        .catch(function(err){
          var done = performance.now();
          log('read ERROR    path=' + p + ' @' + now() + 'ms elapsed=' +
              (done - issued).toFixed(1) + 'ms err=' + (err && err.message), 'slow');
        });
    });
  }

  window.addEventListener('online',  function(){ log('browser ONLINE @'  + now() + 'ms'); });
  window.addEventListener('offline', function(){ log('browser OFFLINE @' + now() + 'ms'); });
})();
</script>
</body>
</html>
